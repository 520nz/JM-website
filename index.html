<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林俊杰粉丝答题</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8B5CF6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="pwa-icon-192.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <style>@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}</style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎵 林俊杰粉丝答题</h1>
            <p style="color:var(--text2);font-size:14px;">为演唱会答题做准备</p>
        </header>
        <nav class="nav">
            <button type="button" class="nav-item active" data-view="home" onclick="App.switchView('home')">首页</button>
            <button type="button" class="nav-item" data-view="practice" onclick="App.switchView('practice')">练习</button>
            <button type="button" class="nav-item" data-view="wrongbook" onclick="App.switchView('wrongbook')">错题本</button>
            <button type="button" class="nav-item" data-view="stats" onclick="App.switchView('stats')">统计</button>
            <button type="button" class="nav-item" data-view="admin" onclick="App.switchView('admin')">管理</button>
            <button type="button" class="theme-toggle" onclick="App.switchTheme()" title="切换主题">🌙</button>
        </nav>
        <div class="view active" id="view-home">
            <div class="card">
                <h3 style="margin-bottom:12px;">开始练习</h3>
                <div class="mode-selector">
                    <div class="mode-btn active" data-mode="quick" onclick="App.selectMode('quick')">
                        <div class="label">快速</div><div class="desc">10题</div>
                    </div>
                    <div class="mode-btn" data-mode="standard" onclick="App.selectMode('standard')">
                        <div class="label">标准</div><div class="desc">20题</div>
                    </div>
                    <div class="mode-btn" data-mode="intensive" onclick="App.selectMode('intensive')">
                        <div class="label">强化</div><div class="desc">30题</div>
                    </div>
                </div>
                <button class="btn" style="margin-top:20px;" onclick="App.startRandomQuiz()">随机练习</button>
                <button class="btn btn-outline" onclick="App.showCategoryView()">分类练习</button>
            </div>
            <div class="card">
                <h3 style="margin-bottom:12px;">今日数据</h3>
                <div class="stat-grid">
                    <div class="stat-card"><div class="stat-value" id="todayCount">0</div><div class="stat-label">今日答题</div></div>
                    <div class="stat-card"><div class="stat-value" id="todayAcc">0%</div><div class="stat-label">正确率</div></div>
                </div>
            </div>
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <h3>连续打卡</h3>
                    <span id="streakBadge" class="streak-badge">🔥 0 天</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <span style="font-size:13px;color:var(--text2);">每日目标</span>
                    <span style="font-size:13px;color:var(--text2);">
                        <span id="goalProgress">0</span> / <span id="goalTarget">20</span> 题
                        <button class="btn btn-sm btn-outline" style="padding:2px 10px;font-size:12px;margin-left:8px;" onclick="App.editDailyGoal()">修改</button>
                    </span>
                </div>
                <div class="progress-bar-bg"><div class="progress-bar" id="goalBar" style="width:0%"></div></div>
            </div>
        </div>
        <div class="view" id="view-practice">
            <div id="quizArea" class="pb-safe">
                <div class="card" style="text-align:center;padding:60px 20px;">
                    <div style="font-size:48px;margin-bottom:16px;">📝</div>
                    <h3 style="margin-bottom:12px;">请先开始答题</h3>
                    <p style="color:var(--text2);margin-bottom:20px;">点击下方按钮开始练习</p>
                    <button class="btn" style="max-width:200px;margin:0 auto;" onclick="App.switchView('home')">去首页开始</button>
                </div>
            </div>
        </div>
        <div class="view" id="view-wrongbook">
            <div class="card"><h3 style="margin-bottom:12px;">错题本</h3><div id="wrongBookList"><div class="empty"><p>暂无错题记录</p></div></div></div>
            <button class="btn" id="wrongBookBtn" onclick="App.startWrongBookQuiz()" style="display:none;">开始复习</button>
        </div>
        <div class="view" id="view-stats">
            <div class="card">
                <h3 style="margin-bottom:12px;">总体统计</h3>
                <div class="stat-grid">
                    <div class="stat-card"><div class="stat-value" id="sTotal">0</div><div class="stat-label">总答题</div></div>
                    <div class="stat-card"><div class="stat-value" id="sCorrect">0</div><div class="stat-label">正确数</div></div>
                    <div class="stat-card"><div class="stat-value" id="sAcc">0%</div><div class="stat-label">正确率</div></div>
                    <div class="stat-card"><div class="stat-value" id="sWrong">0</div><div class="stat-label">错题数</div></div>
                </div>
            </div>
            <div class="card">
                <h3 style="margin-bottom:12px;">答题趋势（近14天）</h3>
                <canvas id="trendChart" style="width:100%;"></canvas>
            </div>
            <div class="card">
                <h3 style="margin-bottom:12px;">分类正确率</h3>
                <div id="catStats"><div class="empty"><p>暂无数据</p></div></div>
            </div>
            <div class="card">
                <h3 style="margin-bottom:12px;">成就徽章 <span id="achvCount" style="font-size:13px;color:var(--text2);font-weight:normal;"></span></h3>
                <div class="achv-grid" id="achvGrid"></div>
            </div>
        </div>
        <div class="view" id="view-category">
            <div class="card"><h3 style="margin-bottom:12px;">选择分类</h3><div class="category-list" id="categoryList"></div></div>
            <button class="btn btn-outline" style="margin-top:12px;" onclick="App.switchView('home')">返回首页</button>
        </div>
        <!-- 管理视图 -->
        <div class="view" id="view-admin">
            <div class="card">
                <h3 style="margin-bottom:12px;">数据管理</h3>
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <button class="btn btn-outline btn-sm" onclick="App.exportData()">📤 导出数据</button>
                        <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
                        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="App.importData(event)">
                    </div>
                    <button class="btn btn-outline btn-sm" style="border-color:var(--error);color:var(--error);" onclick="App.showResetConfirm()">🔄 重置</button>
                </div>
            </div>
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <h3>题库管理</h3>
                    <button class="btn btn-sm" onclick="App.showAddForm()">+ 新增题目</button>
                </div>
                <div style="margin-bottom:12px;display:flex;gap:10px;">
                    <select id="categoryFilter" style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);min-width:100px;" onchange="App.filterQuestions()">
                        <option value="">全部类别</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="搜索题目..." style="flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;" oninput="App.filterQuestions()">
                </div>
                <div id="questionList" style="max-height:400px;overflow-y:auto;"></div>
            </div>
        </div>
        <!-- 编辑/新增题目弹窗 -->
        <div id="editModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;overflow-y:auto;padding:20px;">
            <div style="max-width:500px;margin:0 auto;background:var(--card);border-radius:12px;padding:20px;">
                <h3 id="modalTitle" style="margin-bottom:16px;">新增题目</h3>
                <input type="hidden" id="editId">
                <div style="margin-bottom:12px;">
                    <label style="display:block;font-size:13px;color:var(--text2);margin-bottom:4px;">分类</label>
                    <select id="editCategory" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;">
                    </select>
                </div>
                <div style="margin-bottom:12px;">
                    <label style="display:block;font-size:13px;color:var(--text2);margin-bottom:4px;">题目</label>
                    <textarea id="editQuestion" rows="2" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;resize:vertical;"></textarea>
                </div>
                <div style="margin-bottom:12px;">
                    <label style="display:block;font-size:13px;color:var(--text2);margin-bottom:4px;">选项（每行一个，格式：A.选项内容）</label>
                    <textarea id="editOptions" rows="4" placeholder="A.选项1&#10;B.选项2&#10;C.选项3&#10;D.选项4" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;resize:vertical;"></textarea>
                </div>
                <div style="margin-bottom:12px;">
                    <label style="display:block;font-size:13px;color:var(--text2);margin-bottom:4px;">正确答案</label>
                    <select id="editAnswer" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;color:var(--text2);margin-bottom:4px;">解析</label>
                    <textarea id="editExplanation" rows="2" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;resize:vertical;"></textarea>
                </div>
                <div style="display:flex;gap:10px;">
                    <button class="btn" onclick="App.saveQuestion()">保存</button>
                    <button class="btn btn-outline" onclick="App.closeModal()">取消</button>
                </div>
            </div>
        </div>
        <!-- 恢复默认题库确认弹窗 -->
        <div id="resetModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1001;">
            <div class="reset-modal-content">
                <h3 style="margin-bottom:16px;color:var(--error);">⚠️ 确认恢复默认题库</h3>
                <p style="margin-bottom:16px;color:var(--text2);font-size:14px;">此操作将删除所有自定义题目，恢复为初始的78道默认题目。</p>
                <p style="margin-bottom:16px;color:var(--text);font-size:14px;">请输入 <strong style="color:var(--primary);">恢复默认</strong> 以确认操作：</p>
                <input type="text" id="resetConfirmInput" placeholder="请输入：恢复默认" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:16px;" oninput="App.checkResetInput()">
                <div style="display:flex;gap:10px;">
                    <button class="btn" id="resetConfirmBtn" style="background:var(--error);opacity:0.5;pointer-events:none;" onclick="App.resetQuestionBank()">确认恢复</button>
                    <button class="btn btn-outline" onclick="App.closeResetModal()">取消</button>
                </div>
            </div>
        </div>
    </div>
    <!-- JS 文件按依赖顺序加载 -->
    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
    <script>
    // 注册 Service Worker（PWA 离线支持）
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('sw.js').catch(function(err) {
                console.log('SW registration failed:', err);
            });
        });
    }
    </script>
</body>
</html>
