<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林俊杰答题系统 - 测试</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #0F0A1A; color: #F5F5F5; }
        .test-header { text-align: center; margin-bottom: 30px; }
        .test-header h1 { color: #8B5CF6; }
        .test-result { padding: 16px; border-radius: 8px; margin-bottom: 16px; }
        .test-result.pass { background: rgba(16, 185, 129, 0.15); border: 1px solid #10B981; }
        .test-result.fail { background: rgba(239, 68, 68, 0.15); border: 1px solid #EF4444; }
        .test-name { font-weight: 500; }
        .test-error { color: #EF4444; font-size: 14px; margin-top: 4px; }
        .summary { padding: 20px; background: #1A1225; border-radius: 12px; margin-top: 30px; }
        .summary h3 { color: #8B5CF6; margin-bottom: 12px; }
        .stats { display: flex; gap: 20px; }
        .stat { padding: 12px 20px; background: rgba(139, 92, 246, 0.1); border-radius: 8px; }
        .stat-value { font-size: 24px; font-weight: 700; color: #8B5CF6; }
        .stat-label { font-size: 12px; color: #A0A0A0; }
        .btn { background: linear-gradient(135deg, #8B5CF6, #9333ea); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        .btn:hover { transform: translateY(-2px); }
        .log { background: #0F0A1A; border: 1px solid #2D2340; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="test-header">
        <h1>🧪 林俊杰答题系统测试</h1>
        <p>运行单元测试验证核心功能</p>
    </div>
    
    <div id="testResults"></div>
    
    <div class="summary">
        <h3>测试结果汇总</h3>
        <div class="stats">
            <div class="stat"><div class="stat-value" id="passCount">0</div><div class="stat-label">通过</div></div>
            <div class="stat"><div class="stat-value" id="failCount">0</div><div class="stat-label">失败</div></div>
            <div class="stat"><div class="stat-value" id="totalCount">0</div><div class="stat-label">总计</div></div>
        </div>
    </div>
    
    <div class="log" id="log"></div>
    
    <button class="btn" onclick="runAllTests()">重新运行测试</button>

    <script src="test_quiz.js"></script>
    <script>
        var QUESTION_BANK = [
            {id:"001",category:"专辑",question:"测试题目",options:[{key:"A",text:"选项A"},{key:"B",text:"选项B"}],answer:"A",explanation:"测试解析"}
        ];
        
        var DEFAULT_QUESTION_BANK = QUESTION_BANK.slice();
        
        var state = {quiz:[],idx:0,answered:false,mode:'quick',correctCount:0,startTime:0,timer:null};
        
        var DB = {
            KEY:'jj_quiz_v2',
            get:function(){var d=localStorage.getItem(DB.KEY);return d?JSON.parse(d):DB.defaults();},
            defaults:function(){return{history:[],wrong:[],stats:{total:0,correct:0,cats:{}}};},
            save:function(d){localStorage.setItem(DB.KEY,JSON.stringify(d));},
            addRecord:function(rec){var d=DB.get();d.history.push(rec);d.stats.total++;if(rec.ok)d.stats.correct++;var q=DB.findQ(rec.qid);if(q){if(!d.stats.cats[q.category])d.stats.cats[q.category]={t:0,c:0};d.stats.cats[q.category].t++;if(rec.ok)d.stats.cats[q.category].c++;}DB.save(d);},
            addWrong:function(qid){var d=DB.get();var f=null;for(var i=0;i<d.wrong.length;i++){if(d.wrong[i].qid===qid){f=d.wrong[i];break;}}if(f){f.cnt++;f.time=Date.now();}else{d.wrong.push({qid:qid,cnt:1,time:Date.now()});}DB.save(d);},
            removeWrong:function(qid){var d=DB.get();d.wrong=d.wrong.filter(function(w){return w.qid!==qid;});DB.save(d);},
            getWrong:function(){return DB.get().wrong;},
            findQ:function(qid){for(var i=0;i<QUESTION_BANK.length;i++){if(QUESTION_BANK[i].id===qid)return QUESTION_BANK[i];}return null;}
        };

        function getCount(){var m={quick:10,standard:20,intensive:30};return m[state.mode]||10;}
        function fmtTime(ms){var sec=Math.floor(ms/1000);var m=Math.floor(sec/60);var s=sec%60;return m+'分'+s+'秒';}
        function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

        function log(msg) {
            document.getElementById('log').textContent += msg + '\n';
        }

        function runAllTests() {
            document.getElementById('testResults').innerHTML = '';
            document.getElementById('log').textContent = '';
            
            var assert = {
                equal: function(actual, expected, msg) {
                    if (actual !== expected) {
                        throw new Error((msg || 'Assertion failed') + ': expected ' + expected + ', got ' + actual);
                    }
                },
                notEqual: function(actual, expected, msg) {
                    if (actual === expected) {
                        throw new Error((msg || 'Assertion failed') + ': expected not equal to ' + expected);
                    }
                },
                ok: function(value, msg) {
                    if (!value) {
                        throw new Error(msg || 'Assertion failed: expected truthy value');
                    }
                },
                deepEqual: function(actual, expected, msg) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error((msg || 'Assertion failed') + ': expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
                    }
                }
            };

            var results = { passed: 0, failed: 0, errors: [] };
            
            function test(name, fn) {
                try {
                    fn();
                    results.passed++;
                    log('✓ ' + name);
                    addTestResult(name, true, null);
                } catch (e) {
                    results.failed++;
                    results.errors.push({ test: name, error: e.message });
                    log('✗ ' + name + ': ' + e.message);
                    addTestResult(name, false, e.message);
                }
            }

            function addTestResult(name, passed, error) {
                var el = document.createElement('div');
                el.className = 'test-result ' + (passed ? 'pass' : 'fail');
                el.innerHTML = '<div class="test-name">' + name + '</div>';
                if (error) {
                    el.innerHTML += '<div class="test-error">' + error + '</div>';
                }
                document.getElementById('testResults').appendChild(el);
            }

            test('DB.defaults() 返回正确的默认数据结构', function() {
                var defaults = DB.defaults();
                assert.ok(defaults.history !== undefined, 'history 不存在');
                assert.ok(defaults.wrong !== undefined, 'wrong 不存在');
                assert.ok(defaults.stats !== undefined, 'stats 不存在');
                assert.equal(defaults.stats.total, 0);
                assert.equal(defaults.stats.correct, 0);
                assert.deepEqual(defaults.stats.cats, {});
            });

            test('DB.findQ() 能正确查找题目', function() {
                var q = DB.findQ('001');
                assert.ok(q !== null, '题目001不存在');
                assert.equal(q.category, '专辑');
                assert.equal(q.answer, 'A');
            });

            test('DB.findQ() 查找不存在的题目返回null', function() {
                var q = DB.findQ('nonexistent');
                assert.equal(q, null);
            });

            test('选项解析正则能正确匹配格式', function() {
                var testCases = [
                    { input: 'A.选项1', expected: { key: 'A', text: '选项1' } },
                    { input: 'B、选项2', expected: { key: 'B', text: '选项2' } },
                    { input: 'C．选项3', expected: { key: 'C', text: '选项3' } },
                    { input: 'D. 带空格的选项', expected: { key: 'D', text: '带空格的选项' } }
                ];
                
                for (var i = 0; i < testCases.length; i++) {
                    var match = testCases[i].input.match(/^([A-D])[.、．]\s*(.+)$/);
                    assert.ok(match, '匹配失败: ' + testCases[i].input);
                    assert.equal(match[1], testCases[i].expected.key);
                    assert.equal(match[2], testCases[i].expected.text);
                }
            });

            test('选项解析正则拒绝无效格式', function() {
                var invalidCases = ['A选项', 'E.选项', '1.选项', 'a.选项'];
                for (var i = 0; i < invalidCases.length; i++) {
                    var match = invalidCases[i].match(/^([A-D])[.、．]\s*(.+)$/);
                    assert.equal(match, null, '不应匹配: ' + invalidCases[i]);
                }
            });

            test('shuffle() 函数能打乱数组顺序', function() {
                var arr = [1, 2, 3, 4, 5];
                var shuffled = shuffle(arr.slice());
                assert.equal(shuffled.length, arr.length);
                for (var i = 0; i < arr.length; i++) {
                    assert.ok(shuffled.indexOf(arr[i]) !== -1, '元素丢失');
                }
            });

            test('shuffle() 函数不修改原数组', function() {
                var arr = [1, 2, 3];
                var original = arr.slice();
                shuffle(arr);
                assert.deepEqual(arr, original);
            });

            test('getCount() 返回正确的题目数量', function() {
                state.mode = 'quick';
                assert.equal(getCount(), 10);
                state.mode = 'standard';
                assert.equal(getCount(), 20);
                state.mode = 'intensive';
                assert.equal(getCount(), 30);
                state.mode = 'unknown';
                assert.equal(getCount(), 10);
            });

            test('fmtTime() 格式化时间正确', function() {
                assert.equal(fmtTime(0), '0分0秒');
                assert.equal(fmtTime(59000), '0分59秒');
                assert.equal(fmtTime(60000), '1分0秒');
                assert.equal(fmtTime(61000), '1分1秒');
                assert.equal(fmtTime(3661000), '61分1秒');
            });

            test('checkResetInput() 验证输入', function() {
                function simulateCheck(input) {
                    var btn = { style: {} };
                    if (input === '恢复默认') {
                        btn.style.opacity = '1';
                        btn.style.pointerEvents = 'auto';
                    } else {
                        btn.style.opacity = '0.5';
                        btn.style.pointerEvents = 'none';
                    }
                    return btn;
                }
                
                var btn1 = simulateCheck('恢复默认');
                assert.equal(btn1.style.opacity, '1');
                
                var btn2 = simulateCheck('其他内容');
                assert.equal(btn2.style.opacity, '0.5');
            });

            test('题库分类统计正确', function() {
                var cats = {};
                for (var i = 0; i < QUESTION_BANK.length; i++) {
                    var c = QUESTION_BANK[i].category;
                    cats[c] = (cats[c] || 0) + 1;
                }
                assert.ok(cats['专辑'] > 0, '专辑分类应有题目');
            });

            test('题目数据结构完整', function() {
                for (var i = 0; i < QUESTION_BANK.length; i++) {
                    var q = QUESTION_BANK[i];
                    assert.ok(q.id, '缺少id: ' + i);
                    assert.ok(q.category, '缺少category: ' + q.id);
                    assert.ok(q.question, '缺少question: ' + q.id);
                    assert.ok(q.options && q.options.length >= 2, '选项不足: ' + q.id);
                    assert.ok(q.answer, '缺少answer: ' + q.id);
                    
                    var answerExists = false;
                    for (var j = 0; j < q.options.length; j++) {
                        if (q.options[j].key === q.answer) {
                            answerExists = true;
                            break;
                        }
                    }
                    assert.ok(answerExists, '答案不在选项中: ' + q.id);
                }
            });

            document.getElementById('passCount').textContent = results.passed;
            document.getElementById('failCount').textContent = results.failed;
            document.getElementById('totalCount').textContent = results.passed + results.failed;
            
            log('\n测试完成: ' + results.passed + ' 通过, ' + results.failed + ' 失败');
            if (results.errors.length > 0) {
                log('\n失败详情:');
                for (var i = 0; i < results.errors.length; i++) {
                    log('  - ' + results.errors[i].test + ': ' + results.errors[i].error);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', runAllTests);
    </script>
</body>
</html>
