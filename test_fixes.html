<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修复验证测试</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .test.pass { border-color: #10b981; background: #ecfdf5; }
        .test.fail { border-color: #ef4444; background: #fef2f2; }
        .test-title { font-weight: bold; margin-bottom: 8px; }
        .test-result { font-size: 14px; color: #6b7280; }
        .pass .test-result { color: #059669; }
        .fail .test-result { color: #dc2626; }
        .test-desc { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>修复验证测试</h1>
    <div id="testResults"></div>
    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script>
        function runTests() {
            var results = [];
            var testDiv = document.getElementById('testResults');
            
            function addTest(title, result, desc) {
                var el = document.createElement('div');
                el.className = 'test ' + (result ? 'pass' : 'fail');
                el.innerHTML = '<div class="test-title">' + title + '</div>' +
                               '<div class="test-result">' + (result ? '✓ 通过' : '✗ 失败') + '</div>' +
                               '<div class="test-desc">' + desc + '</div>';
                testDiv.appendChild(el);
                results.push(result);
            }
            
            function test1() {
                if (CanvasRenderingContext2D.prototype.roundRect) {
                    addTest('修复4验证：roundRect polyfill', true, 'Canvas roundRect 方法已可用');
                } else {
                    addTest('修复4验证：roundRect polyfill', false, 'Canvas roundRect 方法不可用');
                }
            }
            
            function test2() {
                var state = {
                    quiz: [{id: 'q1'}, {id: 'q2'}],
                    idx: 1,
                    correctCount: 0,
                    startTime: Date.now(),
                    mode: 'quick',
                    isWrongBookQuiz: true
                };
                App.session.save(state);
                var loaded = App.session.load();
                if (loaded && loaded.isWrongBookQuiz === true && loaded.quizIds.length === 2) {
                    addTest('修复2验证：sessionSave 保存 isWrongBookQuiz', true, '会话数据正确保存了 isWrongBookQuiz 字段');
                } else {
                    addTest('修复2验证：sessionSave 保存 isWrongBookQuiz', false, '会话数据未正确保存 isWrongBookQuiz 字段');
                }
                App.session.clear();
            }
            
            function test3() {
                var state = {
                    quiz: [{id: 'q1'}, {id: 'q2'}],
                    idx: 0,
                    correctCount: 0,
                    startTime: Date.now(),
                    mode: 'quick',
                    isWrongBookQuiz: false
                };
                App.session.save(state);
                var loaded = App.session.load();
                if (loaded && loaded.isWrongBookQuiz === false) {
                    addTest('修复2验证：isWrongBookQuiz 默认值', true, 'isWrongBookQuiz 默认为 false');
                } else {
                    addTest('修复2验证：isWrongBookQuiz 默认值', false, 'isWrongBookQuiz 默认值不正确');
                }
                App.session.clear();
            }
            
            test1();
            test2();
            test3();
            
            var allPass = results.every(function(r) { return r; });
            var summary = document.createElement('div');
            summary.style.marginTop = '20px';
            summary.style.padding = '16px';
            summary.style.borderRadius = '8px';
            summary.style.background = allPass ? '#ecfdf5' : '#fef2f2';
            summary.style.color = allPass ? '#059669' : '#dc2626';
            summary.style.fontWeight = 'bold';
            summary.textContent = allPass ? '所有测试通过！' : '部分测试失败，请检查修复。';
            testDiv.appendChild(summary);
        }
        
        runTests();
    </script>
</body>
</html>
