name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 设置必要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 允许同时进行的部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建并部署到GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Debug - List files
        run: |
          echo "当前目录文件列表："
          ls -la
          echo ""
          echo "index.html 是否存在："
          test -f index.html && echo "✅ index.html 存在" || echo "❌ index.html 不存在"
      
      # 对于纯静态HTML站点，直接使用上传工件的方式
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # 如果Pages未启用，设置启用参数
          enablement: true
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传整个项目根目录
          path: '.'
          # 排除不必要的文件
          exclude_paths: |
            .gitignore
            docs/
            .github/
            skills-main/
            skills-main.zip
            README.md
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4