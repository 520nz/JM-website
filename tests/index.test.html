<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林俊杰答题 - 单元测试</title>
    <style>
        :root {
            --primary: #8B5CF6;
            --success: #10B981;
            --error: #EF4444;
            --warning: #F59E0B;
            --bg: #1A1225;
            --text: #F5F5F5;
            --text2: #A0A0A0;
            --border: #2D2340;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 0; margin-bottom: 20px; }
        .header h1 { color: var(--primary); font-size: 28px; }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .summary-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .summary-card.pass { border-color: var(--success); }
        .summary-card.fail { border-color: var(--error); }
        .summary-card .value { font-size: 32px; font-weight: 700; }
        .summary-card.pass .value { color: var(--success); }
        .summary-card.fail .value { color: var(--error); }
        .summary-card .label { font-size: 14px; color: var(--text2); margin-top: 4px; }
        .test-suite { margin-bottom: 20px; }
        .suite-header {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid var(--primary);
            border-radius: 8px 8px 0 0;
            padding: 14px 18px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .suite-header.collapsed { border-radius: 8px; }
        .suite-body {
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 8px 8px;
        }
        .suite-body.hidden { display: none; }
        .test-case {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .test-case:last-child { border-bottom: none; }
        .test-case.pass { background: rgba(16, 185, 129, 0.05); }
        .test-case.fail { background: rgba(239, 68, 68, 0.05); }
        .test-info { flex: 1; }
        .test-name { font-weight: 500; margin-bottom: 4px; }
        .test-desc { font-size: 13px; color: var(--text2); }
        .test-error { font-size: 12px; color: var(--error); margin-top: 6px; font-family: monospace; }
        .test-status { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .test-status.pass { background: var(--success); color: white; }
        .test-status.fail { background: var(--error); color: white; }
        .btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; }
        .btn:hover { border-color: var(--primary); }
        #detailOutput {
            margin-top: 20px;
            padding: 16px;
            background: #0a0a0a;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }
        #detailOutput.show { display: block; }
        .error { color: var(--error); }
        .success { color: var(--success); }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎵 林俊杰答题 - 单元测试</h1>
            <p style="color:var(--text2);margin-top:8px;">自动化测试缺口分析</p>
        </header>

        <div class="summary" id="summary"></div>

        <div style="margin-bottom:16px;">
            <button class="btn" onclick="runAllTests()">▶ 运行全部测试</button>
            <button class="btn" onclick="toggleDetails()">📋 显示详情</button>
        </div>

        <div id="testSuites"></div>
        <div id="detailOutput"></div>
    </div>

<script>
// ============================================================
// 测试框架
// ============================================================
var TestRunner = {
    suites: [],
    results: { passed: 0, failed: 0, total: 0 },

    describe: function(name, tests) {
        this.suites.push({ name: name, tests: tests });
    },

    run: function() {
        this.results = { passed: 0, failed: 0, total: 0 };
        var output = [];
        var suitesEl = document.getElementById('testSuites');
        suitesEl.innerHTML = '';

        for (var i = 0; i < this.suites.length; i++) {
            var suite = this.suites[i];
            var suiteResults = [];

            for (var j = 0; j < suite.tests.length; j++) {
                var test = suite.tests[j];
                this.results.total++;
                var result = { name: test.name, desc: test.desc, passed: false, error: null };

                try {
                    test.fn();
                    result.passed = true;
                    this.results.passed++;
                } catch (e) {
                    result.passed = false;
                    result.error = e.message || String(e);
                    this.results.failed++;
                }
                suiteResults.push(result);
                output.push((result.passed ? '✓' : '✗') + ' ' + suite.name + ' > ' + result.name + (result.error ? '\n  Error: ' + result.error : ''));
            }

            var suiteEl = document.createElement('div');
            suiteEl.className = 'test-suite';
            suiteEl.innerHTML =
                '<div class="suite-header" onclick="toggleSuite(this)">' +
                    '<span>' + suite.name + ' (' + suiteResults.filter(function(r) { return r.passed; }).length + '/' + suiteResults.length + ')</span>' +
                    '<span>▼</span>' +
                '</div>' +
                '<div class="suite-body">';

            for (var k = 0; k < suiteResults.length; k++) {
                var r = suiteResults[k];
                suiteEl.innerHTML +=
                    '<div class="test-case ' + (r.passed ? 'pass' : 'fail') + '">' +
                        '<div class="test-info">' +
                            '<div class="test-name">' + r.name + '</div>' +
                            (r.desc ? '<div class="test-desc">' + r.desc + '</div>' : '') +
                            (r.error ? '<div class="test-error">Error: ' + r.error + '</div>' : '') +
                        '</div>' +
                        '<span class="test-status ' + (r.passed ? 'pass' : 'fail') + '">' + (r.passed ? '通过' : '失败') + '</span>' +
                    '</div>';
            }
            suiteEl.innerHTML += '</div>';
            suitesEl.appendChild(suiteEl);
        }

        this.renderSummary();
        this.showDetails(output.join('\n'));
    },

    renderSummary: function() {
        var el = document.getElementById('summary');
        el.innerHTML =
            '<div class="summary-card pass"><div class="value">' + this.results.passed + '</div><div class="label">通过</div></div>' +
            '<div class="summary-card fail"><div class="value">' + this.results.failed + '</div><div class="label">失败</div></div>' +
            '<div class="summary-card"><div class="value">' + this.results.total + '</div><div class="label">总计</div></div>' +
            '<div class="summary-card"><div class="value">' + (this.results.total > 0 ? Math.round(this.results.passed / this.results.total * 100) : 0) + '%</div><div class="label">通过率</div></div>';
    },

    showDetails: function(text) {
        var el = document.getElementById('detailOutput');
        el.textContent = text;
    }
};

function toggleSuite(el) {
    var body = el.nextElementSibling;
    var arrow = el.querySelector('span:last-child');
    if (body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        el.classList.remove('collapsed');
        arrow.textContent = '▼';
    } else {
        body.classList.add('hidden');
        el.classList.add('collapsed');
        arrow.textContent = '▶';
    }
}

function toggleDetails() {
    var el = document.getElementById('detailOutput');
    el.classList.toggle('show');
}

// ============================================================
// 断言工具
// ============================================================
function assert(condition, message) {
    if (!condition) {
        throw new Error(message || 'Assertion failed');
    }
}

function assertEqual(actual, expected, message) {
    if (actual !== expected) {
        throw new Error((message || '') + ' Expected: ' + JSON.stringify(expected) + ', Got: ' + JSON.stringify(actual));
    }
}

function assertNotEqual(actual, expected, message) {
    if (actual === expected) {
        throw new Error((message || '') + ' Expected not equal to: ' + JSON.stringify(expected));
    }
}

function assertTrue(value, message) {
    assertEqual(value, true, message);
}

function assertFalse(value, message) {
    assertEqual(value, false, message);
}

function assertNull(value, message) {
    assertEqual(value, null, message);
}

function assertNotNull(value, message) {
    if (value === null || value === undefined) {
        throw new Error((message || '') + ' Expected non-null value, got: ' + value);
    }
}

function assertContains(array, item, message) {
    if (array.indexOf(item) === -1) {
        throw new Error((message || '') + ' Array does not contain item: ' + JSON.stringify(item));
    }
}

function assertNotContains(array, item, message) {
    if (array.indexOf(item) !== -1) {
        throw new Error((message || '') + ' Array should not contain item: ' + JSON.stringify(item));
    }
}

function assertThrows(fn, message) {
    var threw = false;
    try {
        fn();
    } catch (e) {
        threw = true;
    }
    if (!threw) {
        throw new Error(message || 'Expected function to throw');
    }
}

function assertLength(array, length, message) {
    assertEqual(array.length, length, message);
}

// ============================================================
// 测试夹具
// ============================================================
var fixtures = {
    getMockDB: function() {
        var storage = {};
        return {
            storage: storage,
            KEY: 'test_db',
            get: function() {
                var d = storage[this.KEY];
                return d || { history: [], wrong: [], stats: { total: 0, correct: 0, cats: {} } };
            },
            defaults: function() {
                return { history: [], wrong: [], stats: { total: 0, correct: 0, cats: {} } };
            },
            save: function(d) {
                storage[this.KEY] = d;
            },
            clear: function() {
                delete storage[this.KEY];
            }
        };
    },

    getValidQuestion: function() {
        return {
            id: 'test001',
            category: '测试分类',
            question: '这是一道测试题目？',
            options: [
                { key: 'A', text: '选项A' },
                { key: 'B', text: '选项B' },
                { key: 'C', text: '选项C' },
                { key: 'D', text: '选项D' }
            ],
            answer: 'A',
            explanation: '这是测试解析'
        };
    },

    getValidImportData: function() {
        return {
            questionBank: [fixtures.getValidQuestion()],
            userData: {
                history: [{ qid: 'test001', ans: 'A', ok: true, time: Date.now() }],
                wrong: [],
                stats: { total: 1, correct: 1, cats: {} }
            },
            exportTime: new Date().toISOString()
        };
    }
};

// ============================================================
// 测试用例
// ============================================================

TestRunner.describe('选项解析逻辑 (saveQuestion)', [
    {
        name: '标准格式解析',
        desc: '验证 "A.选项1" 格式能正确解析',
        fn: function() {
            var text = 'A.第一个选项\nB.第二个选项\nC.第三个选项\nD.第四个选项';
            var lines = text.split('\n');
            var options = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                var match = line.match(/^([A-D])[.、．]\s*(.+)$/);
                if (match) {
                    options.push({ key: match[1], text: match[2] });
                }
            }
            assertLength(options, 4);
            assertEqual(options[0].key, 'A');
            assertEqual(options[0].text, '第一个选项');
            assertEqual(options[1].key, 'B');
            assertEqual(options[3].key, 'D');
        }
    },
    {
        name: '中文顿号格式解析',
        desc: '验证 "A、选项1" 中文顿号格式能正确解析',
        fn: function() {
            var text = 'A、选项一\nB、选项二\nC、选项三';
            var lines = text.split('\n');
            var options = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                var match = line.match(/^([A-D])[.、．]\s*(.+)$/);
                if (match) {
                    options.push({ key: match[1], text: match[2] });
                }
            }
            assertLength(options, 3);
            assertEqual(options[0].key, 'A');
        }
    },
    {
        name: '空格分隔格式解析',
        desc: '验证 "A. 选项1" 带空格格式能正确解析',
        fn: function() {
            var text = 'A. 选项A\nB. 选项B';
            var lines = text.split('\n');
            var options = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                var match = line.match(/^([A-D])[.、．]\s*(.+)$/);
                if (match) {
                    options.push({ key: match[1], text: match[2] });
                }
            }
            assertLength(options, 2);
            assertEqual(options[0].text, '选项A');
        }
    },
    {
        name: '无效格式过滤',
        desc: '验证不含正确前缀的选项行被过滤',
        fn: function() {
            var text = '这不是选项\nA.第一个选项\n无前缀的选项\nB.第二个选项';
            var lines = text.split('\n');
            var options = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                var match = line.match(/^([A-D])[.、．]\s*(.+)$/);
                if (match) {
                    options.push({ key: match[1], text: match[2] });
                }
            }
            assertLength(options, 2);
        }
    },
    {
        name: '选项数量边界 - 仅1个选项应被拒绝',
        desc: '验证少于2个选项时业务逻辑应拒绝',
        fn: function() {
            var options = [{ key: 'A', text: '唯一的选项' }];
            var isValid = options.length >= 2;
            assertFalse(isValid, '单选项应被标记为无效');
        }
    },
    {
        name: '选项数量边界 - 恰好2个选项应通过',
        desc: '验证2个选项是有效边界',
        fn: function() {
            var options = [
                { key: 'A', text: '选项A' },
                { key: 'B', text: '选项B' }
            ];
            var isValid = options.length >= 2;
            assertTrue(isValid, '双选项应通过验证');
        }
    },
    {
        name: '空行和多余空格处理',
        desc: '验证空行和多余空格不影响解析',
        fn: function() {
            var text = '   \nA.选项A\n\n  \nB.选项B\n   \n';
            var lines = text.split('\n');
            var options = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                var match = line.match(/^([A-D])[.、．]\s*(.+)$/);
                if (match) {
                    options.push({ key: match[1], text: match[2] });
                }
            }
            assertLength(options, 2);
        }
    }
]);

TestRunner.describe('数据导入导出 (importData)', [
    {
        name: '有效JSON导入',
        desc: '验证完整有效数据能正确导入',
        fn: function() {
            var data = fixtures.getValidImportData();
            var json = JSON.stringify(data);
            var parsed = JSON.parse(json);
            assertNotNull(parsed.questionBank);
            assertNotNull(parsed.userData);
            assertLength(parsed.questionBank, 1);
            assertEqual(parsed.userData.stats.total, 1);
        }
    },
    {
        name: '无效JSON格式应抛出异常',
        desc: '验证损坏的JSON能被检测',
        fn: function() {
            var invalidJson = '{"questionBank": [{invalid}]}';
            var threw = false;
            try {
                JSON.parse(invalidJson);
            } catch (e) {
                threw = true;
            }
            assertTrue(threw, '无效JSON应抛出解析异常');
        }
    },
    {
        name: '缺失必需字段处理',
        desc: '验证缺少字段的数据结构有合理默认值',
        fn: function() {
            var partialData = { questionBank: [] };
            var defaultStats = { total: 0, correct: 0, cats: {} };
            var defaultHistory = [];
            var stats = partialData.userData ? partialData.userData.stats : defaultStats;
            assertEqual(stats.total, 0);
            assertEqual(stats.correct, 0);
        }
    },
    {
        name: '空数据导入',
        desc: '验证空questionBank数组能正常处理',
        fn: function() {
            var emptyData = { questionBank: [], userData: null, exportTime: null };
            var hasQuestionBank = emptyData.questionBank && Array.isArray(emptyData.questionBank);
            assertTrue(hasQuestionBank);
            assertLength(emptyData.questionBank, 0);
        }
    },
    {
        name: '导入数据完整性校验',
        desc: '验证导出再导入后数据一致',
        fn: function() {
            var original = fixtures.getValidImportData();
            var json = JSON.stringify(original);
            var restored = JSON.parse(json);
            assertEqual(restored.questionBank.length, original.questionBank.length);
            assertEqual(restored.userData.stats.total, original.userData.stats.total);
            assertEqual(restored.userData.stats.correct, original.userData.stats.correct);
        }
    },
    {
        name: '特殊字符转义处理',
        desc: '验证含特殊字符的题目能正确序列化',
        fn: function() {
            var data = {
                questionBank: [{
                    id: 'test',
                    question: '包含"引号"和\\反斜杠的题目',
                    options: [{ key: 'A', text: '选项含"引号"' }]
                }]
            };
            var json = JSON.stringify(data);
            var parsed = JSON.parse(json);
            assertEqual(parsed.questionBank[0].question, '包含"引号"和\\反斜杠的题目');
            assertEqual(parsed.questionBank[0].options[0].text, '选项含"引号"');
        }
    }
]);

TestRunner.describe('题库版本管理 (loadQuestionBank)', [
    {
        name: '版本不匹配时应清除旧数据',
        desc: '验证版本校验逻辑能正确识别版本差异',
        fn: function() {
            var currentVersion = '2025-05-09-v2';
            var oldVersion = '2025-05-01-v1';
            var shouldReset = oldVersion !== currentVersion;
            assertTrue(shouldReset, '旧版本应触发重置');
        }
    },
    {
        name: '版本匹配时应保留数据',
        desc: '验证版本相同时不重置',
        fn: function() {
            var currentVersion = '2025-05-09-v2';
            var sameVersion = '2025-05-09-v2';
            var shouldReset = sameVersion !== currentVersion;
            assertFalse(shouldReset, '相同版本不应重置');
        }
    },
    {
        name: '空版本值处理',
        desc: '验证首次使用或损坏存储时的行为',
        fn: function() {
            var nullVersion = null;
            var currentVersion = '2025-05-09-v2';
            var shouldReset = nullVersion !== currentVersion;
            assertTrue(shouldReset, '空版本应触发重置');
        }
    }
]);

TestRunner.describe('错题本操作 (DB.addWrong/removeWrong)', [
    {
        name: '新增错题',
        desc: '验证首次加入错题本正确初始化',
        fn: function() {
            var d = { wrong: [] };
            var qid = 'q001';
            d.wrong.push({ qid: qid, cnt: 1, time: Date.now() });
            assertLength(d.wrong, 1);
            assertEqual(d.wrong[0].qid, 'q001');
            assertEqual(d.wrong[0].cnt, 1);
        }
    },
    {
        name: '重复错题累加计数',
        desc: '验证同一题目错误时计数累加',
        fn: function() {
            var d = { wrong: [{ qid: 'q001', cnt: 1, time: Date.now() }] };
            var qid = 'q001';
            var found = null;
            for (var i = 0; i < d.wrong.length; i++) {
                if (d.wrong[i].qid === qid) {
                    found = d.wrong[i];
                    break;
                }
            }
            if (found) {
                found.cnt++;
                found.time = Date.now();
            } else {
                d.wrong.push({ qid: qid, cnt: 1, time: Date.now() });
            }
            assertEqual(found.cnt, 2);
        }
    },
    {
        name: '移除错题',
        desc: '验证从错题本移除题目',
        fn: function() {
            var d = { wrong: [{ qid: 'q001', cnt: 1 }, { qid: 'q002', cnt: 2 }] };
            var qid = 'q001';
            d.wrong = d.wrong.filter(function(w) { return w.qid !== qid; });
            assertLength(d.wrong, 1);
            assertEqual(d.wrong[0].qid, 'q002');
        }
    },
    {
        name: '获取错题列表',
        desc: '验证获取所有错题',
        fn: function() {
            var d = { wrong: [{ qid: 'q001' }, { qid: 'q002' }, { qid: 'q003' }] };
            var wrongList = d.wrong;
            assertLength(wrongList, 3);
        }
    },
    {
        name: '空错题本边界',
        desc: '验证空错题本的处理',
        fn: function() {
            var d = { wrong: [] };
            var isEmpty = d.wrong.length === 0;
            assertTrue(isEmpty);
        }
    }
]);

TestRunner.describe('答题记录 (DB.addRecord)', [
    {
        name: '正确答题记录',
        desc: '验证正确答题时统计累加',
        fn: function() {
            var d = { history: [], stats: { total: 0, correct: 0, cats: {} } };
            var rec = { qid: 'q001', ans: 'A', ok: true, time: Date.now() };
            d.history.push(rec);
            d.stats.total++;
            if (rec.ok) d.stats.correct++;
            assertEqual(d.stats.total, 1);
            assertEqual(d.stats.correct, 1);
        }
    },
    {
        name: '错误答题记录',
        desc: '验证错误答题时正确数不累加',
        fn: function() {
            var d = { history: [], stats: { total: 0, correct: 0, cats: {} } };
            var rec = { qid: 'q001', ans: 'B', ok: false, time: Date.now() };
            d.history.push(rec);
            d.stats.total++;
            if (rec.ok) d.stats.correct++;
            assertEqual(d.stats.total, 1);
            assertEqual(d.stats.correct, 0);
        }
    },
    {
        name: '分类统计累加',
        desc: '验证分类正确率统计正确',
        fn: function() {
            var d = { history: [], stats: { total: 0, correct: 0, cats: {} } };
            var cat = '专辑';
            if (!d.stats.cats[cat]) d.stats.cats[cat] = { t: 0, c: 0 };
            d.stats.cats[cat].t++;
            d.stats.cats[cat].c++;
            assertEqual(d.stats.cats['专辑'].t, 1);
            assertEqual(d.stats.cats['专辑'].c, 1);
        }
    },
    {
        name: '多次答题统计正确性',
        desc: '验证多轮答题后统计正确',
        fn: function() {
            var d = { history: [], stats: { total: 0, correct: 0, cats: {} } };
            var records = [
                { qid: 'q001', ans: 'A', ok: true },
                { qid: 'q002', ans: 'B', ok: false },
                { qid: 'q003', ans: 'C', ok: true }
            ];
            for (var i = 0; i < records.length; i++) {
                var rec = records[i];
                d.history.push(rec);
                d.stats.total++;
                if (rec.ok) d.stats.correct++;
            }
            assertEqual(d.stats.total, 3);
            assertEqual(d.stats.correct, 2);
        }
    }
]);

        }

// 辅助函数（与原代码保持一致）
function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i];
        a[i] = a[j];
        a[j] = t;
    }
    return a;
}
