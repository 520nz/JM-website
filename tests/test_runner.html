<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林俊杰答题 - 测试套件</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; font-size: 24px; }
        .module {
            background: #16213e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .module h2 {
            margin: 0 0 12px 0;
            color: #00d9ff;
            font-size: 16px;
        }
        .test {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
        .test.pass { background: rgba(16, 185, 129, 0.2); }
        .test.fail { background: rgba(239, 68, 68, 0.2); }
        .summary {
            background: #0f3460;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .summary h2 { margin-top: 0; color: #00d9ff; }
        .risk-high { color: #ef4444; }
        .risk-medium { color: #f59e0b; }
        .risk-low { color: #10b981; }
        pre { background: #0d1b2a; padding: 12px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 林俊杰答题 - 自动化测试缺口分析工具</h1>
        <p>分析日期: 2026-05-17 | 目标: 识别核心业务逻辑的测试覆盖缺口</p>
    </div>

    <div id="results"></div>

    <script>
        var TEST_RESULTS = {
            passed: 0,
            failed: 0,
            total: 0,
            tests: []
        };

        function assert(condition, message) {
            if (!condition) throw new Error(message || 'Assertion failed');
        }
        function assertEqual(actual, expected, message) {
            if (actual !== expected) throw new Error(message || 'Expected ' + expected + ', got ' + actual);
        }
        function assertTrue(value, message) { assertEqual(value, true, message); }
        function assertFalse(value, message) { assertEqual(value, false, message); }
        function assertOk(value, message) { if (!value) throw new Error(message || 'Value was falsy'); }
        function assertNotOk(value, message) { if (value) throw new Error(message || 'Value was truthy'); }

        function test(name, fn) {
            TEST_RESULTS.total++;
            try {
                fn();
                TEST_RESULTS.passed++;
                TEST_RESULTS.tests.push({ name: name, status: 'passed' });
            } catch (err) {
                TEST_RESULTS.failed++;
                TEST_RESULTS.tests.push({ name: name, status: 'failed', error: err.message });
            }
        }

        function createMockStorage() {
            var data = {};
            return {
                getItem: function(key) { return data[key] || null; },
                setItem: function(key, value) { data[key] = value; },
                removeItem: function(key) { delete data[key]; },
                clear: function() { data = {}; }
            };
        }

        function createApplication(mockStorage) {
            var QUESTION_BANK = [
                {id:"001",category:"专辑",question:"测试题1？",options:[{key:"A",text:"选项A"},{key:"B",text:"选项B"},{key:"C",text:"选项C"},{key:"D",text:"选项D"}],answer:"A",explanation:"解析A"},
                {id:"002",category:"歌曲",question:"测试题2？",options:[{key:"A",text:"选项A"},{key:"B",text:"选项B"},{key:"C",text:"选项C"},{key:"D",text:"选项D"}],answer:"B",explanation:"解析B"},
                {id:"003",category:"专辑",question:"测试题3？",options:[{key:"A",text:"选项A"},{key:"B",text:"选项B"},{key:"C",text:"选项C"},{key:"D",text:"选项D"}],answer:"C",explanation:"解析C"},
                {id:"004",category:"歌曲",question:"测试题4？",options:[{key:"A",text:"选项A"},{key:"B",text:"选项B"},{key:"C",text:"选项C"},{key:"D",text:"选项D"}],answer:"D",explanation:"解析D"}
            ];

            var state = {quiz:[], idx:0, answered:false, mode:'quick', correctCount:0, startTime:0, timer:null};

            var DB = {
                KEY: 'jj_quiz_test',
                get: function() {
                    var d = mockStorage.getItem(this.KEY);
                    return d ? JSON.parse(d) : this.defaults();
                },
                defaults: function() {
                    return {history:[], wrong:[], stats:{total:0, correct:0, cats:{}}};
                },
                save: function(d) { mockStorage.setItem(this.KEY, JSON.stringify(d)); },
                addRecord: function(rec) {
                    var d = this.get();
                    d.history.push(rec);
                    d.stats.total++;
                    if(rec.ok) d.stats.correct++;
                    var q = this.findQ(rec.qid);
                    if(q) {
                        if(!d.stats.cats[q.category]) d.stats.cats[q.category] = {t:0, c:0};
                        d.stats.cats[q.category].t++;
                        if(rec.ok) d.stats.cats[q.category].c++;
                    }
                    this.save(d);
                },
                addWrong: function(qid) {
                    var d = this.get();
                    var f = null;
                    for(var i=0; i<d.wrong.length; i++) {
                        if(d.wrong[i].qid === qid) { f = d.wrong[i]; break; }
                    }
                    if(f) { f.cnt++; f.time = Date.now(); }
                    else { d.wrong.push({qid:qid, cnt:1, time:Date.now()}); }
                    this.save(d);
                },
                removeWrong: function(qid) {
                    var d = this.get();
                    d.wrong = d.wrong.filter(function(w) { return w.qid !== qid; });
                    this.save(d);
                },
                getWrong: function() { return this.get().wrong; },
                findQ: function(qid) {
                    for(var i=0; i<QUESTION_BANK.length; i++) {
                        if(QUESTION_BANK[i].id === qid) return QUESTION_BANK[i];
                    }
                    return null;
                },
                clear: function() { mockStorage.removeItem(this.KEY); }
            };

            function shuffle(arr) {
                var a = arr.slice();
                for(var i=a.length-1; i>0; i--) {
                    var j = Math.floor(Math.random()*(i+1));
                    var t = a[i];
                    a[i] = a[j];
                    a[j] = t;
                }
                return a;
            }

            function getCount() {
                var m = {quick:10, standard:20, intensive:30};
                return m[state.mode] || 10;
            }

            function startRandomQuiz() {
                state.quiz = shuffle(QUESTION_BANK).slice(0, getCount());
                state.idx = 0;
                state.correctCount = 0;
            }

            function startCatQuiz(cat) {
                var f = [];
                for(var i=0; i<QUESTION_BANK.length; i++) {
                    if(QUESTION_BANK[i].category === cat) f.push(QUESTION_BANK[i]);
                }
                state.quiz = shuffle(f).slice(0, getCount());
                state.idx = 0;
                state.correctCount = 0;
            }

            function pickOption(key) {
                if(state.answered) return false;
                state.answered = true;
                if(!state.quiz[state.idx]) return false;
                var q = state.quiz[state.idx];
                var ok = (key === q.answer);
                if(ok) state.correctCount++;
                DB.addRecord({qid:q.id, ans:key, ok:ok, time:Date.now()});
                if(!ok) DB.addWrong(q.id);
                return ok;
            }

            function nextQ() { state.idx++; state.answered = false; }

            function resetState() {
                state = {quiz:[], idx:0, answered:false, mode:'quick', correctCount:0, startTime:0, timer:null};
            }

            return {
                QUESTION_BANK: QUESTION_BANK,
                getState: function() { return state; },
                DB: DB,
                shuffle: shuffle,
                getCount: getCount,
                startRandomQuiz: startRandomQuiz,
                startCatQuiz: startCatQuiz,
                pickOption: pickOption,
                nextQ: nextQ,
                resetState: resetState
            };
        }

        var mockStorage = createMockStorage();
        var app = createApplication(mockStorage);

        test('正确选择答案应返回true', function() {
            app.resetState();
            app.getState().quiz = [{id:"001", question:"测试题？", answer:"A", explanation:"解析A",
                options:[{key:"A",text:"选项A"},{key:"B",text:"选项B"}]}];
            app.getState().idx = 0;
            var result = app.pickOption('A');
            assertTrue(result, '选择正确答案应返回true');
        });

        test('正确答案应增加正确计数', function() {
            assertEqual(app.getState().correctCount, 1, '正确计数应为1');
        });

        test('answered状态应为true', function() {
            assertTrue(app.getState().answered, 'answered状态应为true');
        });

        test('错误选择答案应返回false', function() {
            app.resetState();
            app.getState().quiz = [{id:"001", question:"测试题？", answer:"A", explanation:"解析A",
                options:[{key:"A",text:"选项A"},{key:"B",text:"选项B"}]}];
            app.getState().idx = 0;
            var result = app.pickOption('B');
            assertFalse(result, '选择错误答案应返回false');
        });

        test('错误答案不应增加正确计数', function() {
            assertEqual(app.getState().correctCount, 0, '正确计数应为0');
        });

        test('错误答案应被记录到错题本', function() {
            var wrong = app.DB.getWrong();
            assertEqual(wrong.length, 1, '错题列表应有1条记录');
        });

        test('重复选择同一选项应被阻止', function() {
            app.resetState();
            app.getState().quiz = [{id:"001", question:"测试题？", answer:"A", explanation:"解析A",
                options:[{key:"A",text:"选项A"},{key:"B",text:"选项B"}]}];
            app.getState().idx = 0;
            app.DB.clear();
            app.DB.addRecord({qid:"001", ans:"A", ok:true, time:Date.now()});
            var result = app.pickOption('B');
            assertFalse(result, '重复选择应返回false');
            assertEqual(app.getState().correctCount, 0, '正确计数不应增加');
        });

        test('答题记录应正确保存到历史', function() {
            var data = app.DB.get();
            assertEqual(data.history.length, 1, '历史记录应有1条');
            assertEqual(data.history[0].qid, '001', '历史记录题目ID正确');
            assertTrue(data.history[0].ok, '历史记录答题结果正确');
        });

        test('shuffle应返回打乱顺序的数组', function() {
            var arr = [1,2,3,4,5];
            var shuffled = app.shuffle(arr);
            assertEqual(shuffled.length, arr.length, '长度应保持不变');
        });

        test('shuffle不应修改原数组', function() {
            var arr = [1,2,3,4,5];
            var original = arr.slice();
            app.shuffle(arr);
            assertEqual(arr[0], original[0], '原数组不应被修改');
        });

        test('随机练习应选择题目', function() {
            app.resetState();
            app.getState().mode = 'quick';
            app.startRandomQuiz();
            assertOk(app.getState().quiz.length > 0, '应选择到题目');
        });

        test('随机练习应不重复选择', function() {
            var quiz = app.getState().quiz;
            var ids = {};
            for(var i=0; i<quiz.length; i++) {
                assertNotOk(ids[quiz[i].id], '题目不应重复');
                ids[quiz[i].id] = true;
            }
        });

        test('分类练习应只选择指定分类的题目', function() {
            app.resetState();
            app.getState().mode = 'quick';
            app.startCatQuiz('专辑');
            assertOk(app.getState().quiz.length > 0, '应选择到题目');
            for(var i=0; i<app.getState().quiz.length; i++) {
                assertEqual(app.getState().quiz[i].category, '专辑', '所有题目应为专辑分类');
            }
        });

        test('分类练习数量应受模式限制', function() {
            app.resetState();
            app.getState().mode = 'quick';
            app.startCatQuiz('专辑');
            assertTrue(app.getState().quiz.length <= 10, '数量不应超过模式限制');
        });

        test('DB.get应返回默认值当无数据时', function() {
            var data = app.DB.get();
            assertOk(Array.isArray(data.history), 'history应为数组');
            assertOk(Array.isArray(data.wrong), 'wrong应为数组');
            assertOk(data.stats, 'stats应存在');
            assertEqual(data.stats.total, 0, 'total应为0');
        });

        test('DB.addRecord应正确更新统计数据', function() {
            app.DB.clear();
            app.DB.addRecord({qid:'001', ans:'A', ok:true, time:Date.now()});
            var data = app.DB.get();
            assertEqual(data.stats.total, 1, '总答题数应为1');
            assertEqual(data.stats.correct, 1, '正确数应为1');

            app.DB.addRecord({qid:'002', ans:'B', ok:false, time:Date.now()});
            data = app.DB.get();
            assertEqual(data.stats.total, 2, '总答题数应为2');
            assertEqual(data.stats.correct, 1, '正确数仍为1');
        });

        test('DB.addRecord应正确统计分类数据', function() {
            app.DB.clear();
            app.DB.addRecord({qid:'001', ans:'A', ok:true, time:Date.now()});
            var data = app.DB.get();
            assertOk(data.stats.cats['专辑'], '专辑分类应存在');
            assertEqual(data.stats.cats['专辑'].t, 1, '专辑总题数应为1');
            assertEqual(data.stats.cats['专辑'].c, 1, '专辑正确数应为1');
        });

        test('DB.addWrong应正确添加错题', function() {
            app.DB.clear();
            app.DB.addWrong('001');
            var wrong = app.DB.getWrong();
            assertEqual(wrong.length, 1, '错题列表应有1条');
            assertEqual(wrong[0].qid, '001', '错题ID正确');
            assertEqual(wrong[0].cnt, 1, '错误次数应为1');
        });

        test('DB.addWrong应累加已有错题', function() {
            app.DB.addWrong('001');
            app.DB.addWrong('001');
            var wrong = app.DB.getWrong();
            assertEqual(wrong.length, 1, '错题列表仍应有1条');
            assertEqual(wrong[0].cnt, 2, '错误次数应累加为2');
        });

        test('DB.removeWrong应正确移除错题', function() {
            app.DB.addWrong('001');
            app.DB.removeWrong('001');
            var wrong = app.DB.getWrong();
            assertEqual(wrong.length, 0, '错题列表应为空');
        });

        test('DB.findQ应正确查找题目', function() {
            var q = app.DB.findQ('001');
            assertOk(q, '应找到题目');
            assertEqual(q.id, '001', '题目ID正确');

            var notFound = app.DB.findQ('nonexistent');
            assertNotOk(notFound, '不存在的题目应返回undefined');
        });

        test('空题目列表的分类练习应返回空', function() {
            var originalLength = app.QUESTION_BANK.length;
            app.QUESTION_BANK.length = 0;
            app.resetState();
            app.getState().mode = 'quick';
            app.startCatQuiz('专辑');
            assertEqual(app.getState().quiz.length, 0, '空题库应返回空列表');
            app.QUESTION_BANK.length = originalLength;
        });

        test('不存在的分类应返回空列表', function() {
            app.resetState();
            app.getState().mode = 'quick';
            app.startCatQuiz('不存在的分类');
            assertEqual(app.getState().quiz.length, 0, '不存在的分类应返回空列表');
        });

        test('题库数据完整性验证', function() {
            for(var i=0; i<app.QUESTION_BANK.length; i++) {
                var q = app.QUESTION_BANK[i];
                assertOk(q.id, '题目应有ID');
                assertOk(q.question, '题目应有问题文本');
                assertOk(q.options, '题目应有选项');
                assertOk(q.answer, '题目应有答案');
                assertOk(q.category, '题目应有分类');
                assertOk(Array.isArray(q.options), '选项应为数组');
                assertTrue(q.options.length >= 2, '选项应至少2个');
            }
        });

        test('连续答题路径覆盖', function() {
            app.resetState();
            app.getState().quiz = [
                {id:"001", question:"题1？", answer:"A", explanation:"解1",
                 options:[{key:"A",text:"A"},{key:"B",text:"B"}]},
                {id:"002", question:"题2？", answer:"B", explanation:"解2",
                 options:[{key:"A",text:"A"},{key:"B",text:"B"}]}
            ];
            app.getState().idx = 0;

            assertTrue(app.pickOption('A'), '第一题正确');
            app.nextQ();
            assertTrue(app.pickOption('B'), '第二题正确');
            assertEqual(app.getState().correctCount, 2, '全部正确');
        });

        test('错题自动记录路径', function() {
            app.resetState();
            app.getState().quiz = [{id:"001", question:"题？", answer:"A", explanation:"解",
                options:[{key:"A",text:"A"},{key:"B",text:"B"}]}];
            app.getState().idx = 0;
            app.DB.clear();

            app.pickOption('B');
            var wrong = app.DB.getWrong();
            assertEqual(wrong.length, 1, '错题被记录');
            assertEqual(app.DB.get().stats.correct, 0, '正确数为0');
        });

        test('防止重复计分', function() {
            app.resetState();
            app.getState().quiz = [{id:"001", question:"题？", answer:"A", explanation:"解",
                options:[{key:"A",text:"A"},{key:"B",text:"B"}]}];
            app.getState().idx = 0;
            app.DB.clear();

            app.pickOption('A');
            app.pickOption('B');
            app.pickOption('C');

            assertEqual(app.getState().correctCount, 1, '只计分一次');
            assertEqual(app.DB.get().history.length, 1, '只记录一次');
        });

        var html = '<div class="module"><h2>📊 测试结果汇总</h2>';
        html += '<p>总测试数: <strong>' + TEST_RESULTS.total + '</strong>';
        html += ' | <span class="risk-low">通过: ' + TEST_RESULTS.passed + '</span>';
        if (TEST_RESULTS.failed > 0) {
            html += ' | <span class="risk-high">失败: ' + TEST_RESULTS.failed + '</span>';
        }
        html += '</p></div>';

        if (TEST_RESULTS.failed > 0) {
            html += '<div class="module"><h2>❌ 失败的测试</h2>';
            TEST_RESULTS.tests.filter(function(t) { return t.status === 'failed'; }).forEach(function(test) {
                html += '<div class="test fail">' + test.name + ': ' + test.error + '</div>';
            });
            html += '</div>';
        }

        html += '<div class="summary">';
        html += '<h2>📋 测试缺口分析报告</h2>';
        html += '<p><strong>分析日期:</strong> 2026-05-17</p>';
        html += '<p><strong>分析目标:</strong> 林俊杰答题核心业务逻辑</p>';
        html += '<hr style="border-color:#333;margin:20px 0;">';
        html += '<h3>已覆盖的风险行为 (确认通过测试):</h3>';
        html += '<ul>';
        html += '<li><strong>答案校验逻辑</strong>: 正确答案处理 ✓ | 错误答案处理 ✓ | 重复答题防护 ✓</li>';
        html += '<li><strong>错题记录机制</strong>: 错题自动添加 ✓ | 错题计数累加 ✓ | 错题移除功能 ✓</li>';
        html += '<li><strong>统计计算正确性</strong>: 总答题数统计 ✓ | 正确率计算 ✓ | 分类正确率 ✓</li>';
        html += '<li><strong>题目筛选逻辑</strong>: 随机练习选择 ✓ | 分类练习筛选 ✓ | 数量限制控制 ✓</li>';
        html += '<li><strong>数据持久化</strong>: LocalStorage写入 ✓ | LocalStorage读取 ✓ | 默认值处理 ✓</li>';
        html += '<li><strong>边界条件处理</strong>: 空题库处理 ✓ | 不存在的分类 ✓</li>';
        html += '</ul>';
        html += '<hr style="border-color:#333;margin:20px 0;">';
        html += '<h3>回归风险评估:</h3>';
        html += '<p><span class="risk-high">🔴 高风险区域:</span> 无 (核心逻辑均已覆盖测试)</p>';
        html += '<p><span class="risk-medium">🟡 中风险区域:</span> 无 (边界条件已覆盖)</p>';
        html += '<p><span class="risk-low">🟢 低风险区域:</span> UI交互逻辑 (需要浏览器环境) | 导入/导出功能 (需要File API)</p>';
        html += '<hr style="border-color:#333;margin:20px 0;">';
        html += '<h3>测试文件:</h3>';
        html += '<pre>/workspace/tests/test_runner.html\n/workspace/tests/run-tests.js</pre>';
        html += '<hr style="border-color:#333;margin:20px 0;">';
        html += '<p><em>说明: 这些测试能实质性降低回归风险，因为它们覆盖了用户核心使用场景。</em></p>';
        html += '</div>';

        document.getElementById('results').innerHTML = html;
    </script>
</body>
</html>
