<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林俊杰答题 - 测试</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0F0A1A; color: #F5F5F5; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: #8B5CF6; }
        .result-box { padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .result-box.success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
        .result-box.fail { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); }
        .result-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .result-stats { font-size: 14px; color: #B8B8C8; }
        .test-output { background: #1A0F2E; padding: 20px; border-radius: 12px; font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 600px; overflow-y: auto; }
        .btn { background: #8B5CF6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
        .btn-outline { background: transparent; border: 1px solid #8B5CF6; color: #8B5CF6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 林俊杰答题 - 自动化测试</h1>
            <p style="color:#B8B8C8;font-size:14px;">回归测试安全网</p>
        </div>

        <button class="btn" onclick="runTests()">▶ 运行所有测试</button>
        <button class="btn btn-outline" style="margin-left:10px;" onclick="clearOutput()">清空输出</button>

        <div id="testResult" class="result-box" style="display:none;"></div>
        <div id="testOutput" class="test-output"></div>

        <div id="view-practice" class="view active" style="display:none;">
            <div id="quizArea">
                <div class="feedback" id="fb">
                    <div class="feedback-title" id="fbTitle"></div>
                    <div class="feedback-desc" id="fbDesc"></div>
                </div>
                <button class="btn" id="nextBtn" style="display:none;">下一题</button>
            </div>
            <div id="timerVal">0:00</div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/quiz.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/app.js"></script>
    <script src="lib/test.js"></script>
    <script src="test-storage.js"></script>
    <script src="test-achievements.js"></script>
    <script src="test-quiz.js"></script>
    <script src="test-admin.js"></script>

    <script>
        function runTests() {
            var output = document.getElementById('testOutput');
            var result = document.getElementById('testResult');
            output.textContent = '';
            result.style.display = 'none';

            var originalLog = console.log;
            console.log = function(msg) {
                output.textContent += msg + '\n';
                output.scrollTop = output.scrollHeight;
            };

            try {
                var passed = Test.run();
                result.style.display = 'block';
                result.className = 'result-box ' + (passed ? 'success' : 'fail');
            } finally {
                console.log = originalLog;
            }
        }

        function clearOutput() {
            document.getElementById('testOutput').textContent = '';
            document.getElementById('testResult').style.display = 'none';
        }
    </script>
</body>
</html>
