<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试运行器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #fff; padding: 20px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { color: #888; font-size: 14px; }
        .btn {
            display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #8B5CF6, #9333ea);
            color: #fff; border: none; border-radius: 12px; font-size: 16px; cursor: pointer;
            transition: all 0.3s; margin-bottom: 20px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139,92,246,0.4); }
        .result { background: #252545; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .result h3 { margin-bottom: 16px; font-size: 18px; }
        .test-item { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
        .test-item.pass { background: rgba(16, 185, 129, 0.15); color: #10B981; }
        .test-item.fail { background: rgba(239, 68, 68, 0.15); color: #EF4444; }
        .summary { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .summary-item { text-align: center; }
        .summary-item .val { font-size: 32px; font-weight: 700; }
        .summary-item .lbl { font-size: 12px; color: #888; margin-top: 4px; }
        .summary-item.pass .val { color: #10B981; }
        .summary-item.fail .val { color: #EF4444; }
        .log { background: #0d0d1a; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 林俊杰答题应用 - 测试套件</h1>
            <p>点击下方按钮运行所有测试</p>
        </div>
        
        <button class="btn" onclick="runAllTests()">运行测试</button>
        
        <div class="summary" id="summary" style="display:none;">
            <div class="summary-item pass"><div class="val" id="passCount">0</div><div class="lbl">通过</div></div>
            <div class="summary-item fail"><div class="val" id="failCount">0</div><div class="lbl">失败</div></div>
        </div>
        
        <div class="result" id="results" style="display:none;">
            <h3>测试结果详情</h3>
            <div id="testList"></div>
        </div>
        
        <div class="log" id="log" style="display:none;"></div>
        
        <div style="text-align:center;margin-top:20px;">
            <a href="index.html" style="color:#8B5CF6;text-decoration:none;font-size:14px;">返回应用</a>
        </div>
    </div>

    <script src="test_quiz.js"></script>
    <script>
        function runAllTests(){
            document.getElementById('summary').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            document.getElementById('log').style.display = 'none';
            
            console.clear();
            var originalLog = console.log;
            var logContent = '';
            
            console.log = function(...args){
                logContent += args.join(' ') + '\n';
                originalLog.apply(console, args);
            };
            
            var result = runTests();
            
            console.log = originalLog;
            
            document.getElementById('passCount').textContent = result.passed;
            document.getElementById('failCount').textContent = result.failed;
            
            var testList = '';
            for(var i=0;i<result.results.length;i++){
                var isPass = result.results[i].startsWith('✓');
                testList += '<div class="test-item ' + (isPass ? 'pass' : 'fail') + '">' + result.results[i] + '</div>';
            }
            document.getElementById('testList').innerHTML = testList;
            document.getElementById('log').textContent = logContent;
            
            document.getElementById('summary').style.display = 'flex';
            document.getElementById('results').style.display = 'block';
            document.getElementById('log').style.display = 'block';
        }
        
        window.addEventListener('DOMContentLoaded', function(){
            console.log('测试套件已加载');
        });
    </script>
</body>
</html>
