<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试运行器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #8B5CF6;
            margin-bottom: 8px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8B5CF6, #9333ea);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }
        .results {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
            border: 1px solid #2d2340;
        }
        .result-item {
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 14px;
        }
        .result-item.pass {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            border-left: 3px solid #10B981;
        }
        .result-item.fail {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            border-left: 3px solid #EF4444;
        }
        .summary {
            margin-top: 20px;
            padding: 16px;
            background: #16213e;
            border-radius: 12px;
            border: 1px solid #2d2340;
            text-align: center;
        }
        .summary .stats {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .summary .stats .pass { color: #10B981; }
        .summary .stats .fail { color: #EF4444; }
        .log {
            background: #0f0f1a;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 16px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧪 测试运行器</h1>
        <p style="color:#A0A0A0;font-size:14px;">林俊杰粉丝答题 - 自动化测试</p>
    </div>
    
    <button class="btn" onclick="runAllTests()">▶️ 运行所有测试</button>
    
    <div class="results" id="results">
        <p style="text-align:center;color:#A0A0A0;">点击上方按钮开始测试</p>
    </div>
    
    <div class="summary hidden" id="summary">
        <div class="stats">
            <span class="pass" id="passCount">0</span> / <span class="total" id="totalCount">0</span> 通过
        </div>
        <p style="font-size:14px;color:#A0A0A0;">运行时间: <span id="runTime">0</span>ms</p>
    </div>
    
    <div class="log hidden" id="log">
        <p>测试输出日志...</p>
    </div>

    <script>
        var originalConsoleLog = console.log;
        var logBuffer = [];
        
        function captureLog() {
            console.log = function() {
                var args = Array.prototype.slice.call(arguments);
                logBuffer.push(args.join(' '));
                originalConsoleLog.apply(console, arguments);
            };
        }
        
        function releaseLog() {
            console.log = originalConsoleLog;
        }
        
        function runAllTests() {
            logBuffer = [];
            captureLog();
            
            var startTime = Date.now();
            var results = window.runTests();
            var endTime = Date.now();
            
            releaseLog();
            
            displayResults(results);
            displaySummary(results, endTime - startTime);
            displayLog();
        }
        
        function displayResults(results) {
            var container = document.getElementById('results');
            container.innerHTML = '';
            
            results.results.forEach(function(result) {
                var item = document.createElement('div');
                item.className = 'result-item ' + (result.passed ? 'pass' : 'fail');
                item.innerHTML = result.passed ? '✓ ' : '✗ ';
                item.innerHTML += result.name;
                if (!result.passed) {
                    item.innerHTML += '<br><span style="font-size:12px;opacity:0.8;">' + result.error + '</span>';
                }
                container.appendChild(item);
            });
        }
        
        function displaySummary(results, time) {
            var summary = document.getElementById('summary');
            document.getElementById('passCount').textContent = results.passed;
            document.getElementById('totalCount').textContent = results.total;
            document.getElementById('runTime').textContent = time;
            summary.classList.remove('hidden');
        }
        
        function displayLog() {
            var log = document.getElementById('log');
            log.textContent = logBuffer.join('\n');
            log.classList.remove('hidden');
        }
    </script>
    
    <script src="quiz.js"></script>
    <script src="test_quiz.js"></script>
</body>
</html>
